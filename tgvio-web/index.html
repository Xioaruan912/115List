<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f3f4" media="(prefers-color-scheme: light)" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="https://res.oplist.org/logo/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Loading...</title>
    <script>
      // OpenList fills these placeholders when it serves index.html.
      window.OPENLIST_CONFIG = { cdn: undefined, base_path: undefined, api: undefined, main_color: undefined };
      (function () {
        try {
          var t = localStorage.getItem("tgvio-web:theme");
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <!-- customize head -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- customize body -->
  </body>
</html>
