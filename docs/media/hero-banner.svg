<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0b0c"/>
      <stop offset="58%" stop-color="#101113"/>
      <stop offset="100%" stop-color="#0c0d0e"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="78%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#c4ec5c" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#c4ec5c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0c0c0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="posterMain" x1="0" y1="0" x2="180" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d201c"/>
      <stop offset="52%" stop-color="#141615"/>
      <stop offset="100%" stop-color="#0e0f10"/>
    </linearGradient>
    <linearGradient id="posterSideA" x1="0" y1="0" x2="140" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1b1f"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="posterSideB" x1="0" y1="0" x2="140" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b1c19"/>
      <stop offset="100%" stop-color="#101110"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#c4ec5c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stageClip">
      <rect x="610" y="16" width="574" height="308" rx="16"/>
    </clipPath>
    <clipPath id="mainCardClip">
      <rect x="0" y="0" width="184" height="242" rx="14"/>
    </clipPath>
    <style>
      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Inter", "Segoe UI", sans-serif;
        fill: #f5f5f7;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        fill: #e4e4e7;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .sub {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        fill: #8e8e93;
        font-size: 13.5px;
        letter-spacing: 0.02em;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        fill: #d4d4d8;
        font-size: 12px;
        font-weight: 500;
      }
      .badge-dark {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        fill: #11140b;
        font-size: 10.5px;
        font-weight: 700;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        fill: #f5f5f7;
        font-size: 13.5px;
        font-weight: 600;
      }
      .card-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        fill: #a1a1aa;
        font-size: 10.5px;
      }
      .float-main { animation: driftMain 7.5s ease-in-out infinite; }
      .float-left { animation: driftLeft 8.8s ease-in-out infinite; }
      .float-right { animation: driftRight 9.4s ease-in-out infinite; }
      .sheen-sweep { animation: sweep 7.5s ease-in-out infinite; }
      .pulse-dot { animation: pulseDot 3s ease-in-out infinite; }

      @keyframes driftMain {
        0%, 100% { transform: translate(814px, 46px); }
        50% { transform: translate(814px, 38px); }
      }
      @keyframes driftLeft {
        0%, 100% { transform: translate(646px, 74px) rotate(-4deg); }
        50% { transform: translate(646px, 82px) rotate(-3.2deg); }
      }
      @keyframes driftRight {
        0%, 100% { transform: translate(1018px, 68px) rotate(4deg); }
        50% { transform: translate(1018px, 60px) rotate(3.2deg); }
      }
      @keyframes sweep {
        0%, 62% { transform: translateX(-220px); opacity: 0; }
        74% { opacity: 1; }
        94% { transform: translateX(240px); opacity: 0; }
        100% { transform: translateX(240px); opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        .float-main { animation: none; transform: translate(814px, 46px); }
        .float-left { animation: none; transform: translate(646px, 74px) rotate(-4deg); }
        .float-right { animation: none; transform: translate(1018px, 68px) rotate(4deg); }
        .sheen-sweep, .pulse-dot { animation: none; }
      }
    </style>
  </defs>

  <!-- Outer Cinema Surface -->
  <rect width="1200" height="340" rx="22" fill="url(#canvas)"/>
  <rect width="1200" height="340" rx="22" fill="url(#limeGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="21.5" stroke="rgba(255,255,255,0.08)"/>

  <!-- Subtle editorial divider hairlines on right stage -->
  <g stroke="rgba(255,255,255,0.035)" stroke-width="1">
    <line x1="628" y1="68" x2="1164" y2="68"/>
    <line x1="628" y1="170" x2="1164" y2="170"/>
    <line x1="628" y1="272" x2="1164" y2="272"/>
  </g>

  <!-- Left Brand & Copy -->
  <g transform="translate(64, 66)">
    <!-- Signature Acid-Lime App Mark -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#c4ec5c"/>
    <polygon points="18,14 31,22 18,30" fill="#11140b"/>

    <!-- Wordmark -->
    <text x="60" y="38" class="wordmark">115List</text>

    <!-- Main Tagline -->
    <text x="2" y="96" class="tagline">把 115 网盘，变成你的私人影院</text>
    <text x="2" y="128" class="sub">电影与剧集自动配海报、挂字幕、记进度，打开网页就能看</text>

    <!-- Everyday Feature Pills -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="114" height="32" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.1)"/>
      <circle cx="17" cy="16" r="3.5" fill="#c4ec5c" class="pulse-dot"/>
      <text x="64" y="20.5" text-anchor="middle" class="pill-text">自动海报墙</text>

      <rect x="126" y="0" width="104" height="32" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.1)"/>
      <text x="178" y="20.5" text-anchor="middle" class="pill-text">跨设备续播</text>

      <rect x="242" y="0" width="140" height="32" rx="16" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.1)"/>
      <text x="312" y="20.5" text-anchor="middle" class="pill-text">手机 · 平板 · 电视</text>
    </g>
  </g>

  <!-- Right Animated Cinema Poster Stage -->
  <g clip-path="url(#stageClip)">
    <!-- Left Recessed Poster Card -->
    <g class="float-left" opacity="0.72">
      <rect width="142" height="198" rx="14" fill="url(#posterSideA)" stroke="rgba(255,255,255,0.09)"/>
      <rect x="14" y="14" width="114" height="120" rx="9" fill="#18191e"/>
      <circle cx="71" cy="70" r="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="14" y="148" width="68" height="8" rx="4" fill="rgba(255,255,255,0.22)"/>
      <rect x="14" y="164" width="44" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
      <rect x="94" y="162" width="34" height="14" rx="7" fill="rgba(196,236,92,0.14)"/>
      <text x="102" y="172.5" class="card-meta" fill="#c4ec5c">8.6</text>
    </g>

    <!-- Right Recessed Poster Card -->
    <g class="float-right" opacity="0.72">
      <rect width="142" height="198" rx="14" fill="url(#posterSideB)" stroke="rgba(255,255,255,0.09)"/>
      <rect x="14" y="14" width="114" height="120" rx="9" fill="#171917"/>
      <rect x="34" y="42" width="74" height="64" rx="10" fill="rgba(196,236,92,0.06)" stroke="rgba(196,236,92,0.16)"/>
      <rect x="14" y="148" width="78" height="8" rx="4" fill="rgba(255,255,255,0.22)"/>
      <rect x="14" y="164" width="52" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
      <rect x="94" y="162" width="34" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
      <text x="102" y="172.5" class="card-meta">剧集</text>
    </g>

    <!-- Center Featured Cinema Card -->
    <g class="float-main">
      <g clip-path="url(#mainCardClip)">
        <rect width="184" height="242" rx="14" fill="url(#posterMain)"/>
        <!-- Abstract Cinema Visual -->
        <rect x="12" y="12" width="160" height="142" rx="10" fill="#181b17"/>
        <circle cx="92" cy="78" r="46" fill="rgba(196,236,92,0.07)"/>
        <circle cx="92" cy="78" r="26" fill="rgba(196,236,92,0.14)" stroke="rgba(196,236,92,0.35)"/>
        <polygon points="87,69 102,78 87,87" fill="#c4ec5c"/>

        <!-- Top Badges -->
        <rect x="20" y="20" width="58" height="20" rx="10" fill="#c4ec5c"/>
        <text x="49" y="33.5" text-anchor="middle" class="badge-dark">4K 中字</text>
        <rect x="128" y="20" width="36" height="20" rx="10" fill="rgba(12,12,13,0.72)" stroke="rgba(255,255,255,0.14)"/>
        <text x="146" y="33.5" text-anchor="middle" class="card-meta" fill="#f5f5f7">9.1</text>

        <!-- Title & Progress -->
        <text x="16" y="176" class="card-title">正在续播 · 第 4 集</text>
        <text x="16" y="194" class="card-meta">已同步至手机与电视</text>

        <!-- Animated Playback Progress Bar -->
        <rect x="16" y="212" width="152" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
        <rect x="16" y="212" width="64" height="5" rx="2.5" fill="#c4ec5c">
          <animate attributeName="width" values="42;126;42" dur="9s" keyTimes="0;0.78;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" repeatCount="indefinite"/>
        </rect>
        <circle cx="80" cy="214.5" r="4.5" fill="#f5f5f7">
          <animate attributeName="cx" values="58;142;58" dur="9s" keyTimes="0;0.78;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" repeatCount="indefinite"/>
        </circle>

        <!-- Periodic Light Sheen -->
        <rect class="sheen-sweep" x="0" y="0" width="90" height="242" fill="url(#sheen)"/>
      </g>
      <rect x="0.5" y="0.5" width="183" height="241" rx="13.5" stroke="rgba(196,236,92,0.32)"/>
    </g>
  </g>
</svg>
